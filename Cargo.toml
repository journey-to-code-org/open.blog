[workspace]
resolver = "2"
members = [
    "crates/openblog-core",
    "crates/openblog-cli",
    "crates/openblog-wasm",
]

[workspace.package]
version = "0.56.0"
edition = "2021"
# Merman, the diagram renderer, needs 1.95 (ADR 0416).
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/journey-to-code-org/open.blog"

[workspace.dependencies]
http = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Password hashing is slow without optimizations; keep debug builds usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Reducing a photo is slow without optimizations; keep the debug server and its tests usable.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.png]
opt-level = 3

[patch.crates-io]
# merman-core and merman-model 0.10.0 with one change: it does not turn on serde_json's `preserve_order`, which
# would otherwise change the key order of every JSON file open.blog writes (ADR 0416).
merman-core = { path = "vendor/merman-core" }
merman-model = { path = "vendor/merman-model" }
