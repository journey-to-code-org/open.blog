[dependencies.cssparser]
version = "0.38.0"
features = ["fast_match_byte"]
default-features = false

[dependencies.granit-parser]
version = "2.1.0"
features = ["error_messages"]
default-features = false

[dependencies.indexmap]
version = "2.14.2"
features = ["serde"]
optional = true

[dependencies.json5]
version = "1.3.7"

[dependencies.lalrpop-util]
version = "0.23.2"
optional = true
default-features = false

[dependencies.merman-markup]
version = "0.10.0"
features = [
    "html",
    "url",
]
default-features = false

[dependencies.merman-model]
version = "0.10.0"
features = ["html-entities"]
default-features = false

[dependencies.rustc-hash]
version = "2.1.3"
optional = true

[dependencies.ryu-js]
version = "1.0.3"
optional = true

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.154"
features = ["float_roundtrip"]

[dependencies.thiserror]
version = "2.0.21"

[dependencies.unicode-general-category]
version = "1.1.0"
optional = true

[dev-dependencies.futures]
version = "0.3.34"
features = ["executor"]
default-features = false

[dev-dependencies.merman-model]
version = "0.10.0"
features = ["test-support"]
default-features = false

[dev-dependencies.regex]
version = "1.13.1"
