# Netlify receives finished production deploys from GitHub Actions. In Netlify,
# set Project configuration > Developer settings > Continuous deployment >
# Build settings > Build status to "Stopped builds". Main pushes and scheduled
# posts are built on GitHub and uploaded with `netlify deploy --no-build`, so
# Netlify never clones this repository or installs Rust.
#
# Caching: Netlify's default (revalidate with an ETag) is kept on purpose.
# Pages reference stylesheets and scripts with a content-derived ?v= so they
# change URL when they change, but modules imported by other scripts are not
# versioned, so long path-based cache rules would serve stale code after a deploy.

[build]
  publish = "dist"

# Pull request previews and branch deploys (including `develop`) are not built:
# GitHub CI tests every change, and only `main` is deployed.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[build.environment]
  CARGO_TERM_COLOR = "always"

[functions]
  directory = "netlify/functions"

# Bundle the engagement function into one file, so it can import the shared
# feedback validator from web/components (ADR 0081). Other functions keep
# Netlify's default bundler.
[functions."engagement"]
  node_bundler = "esbuild"

# Optional social publishing (ADRs 0293 and 0331). Off unless OPENBLOG_SOCIAL_ENABLED is set.
[functions."social"]
  node_bundler = "esbuild"

# Optional received Webmentions (ADRs 0364 and 0365). Off unless OPENBLOG_WEBMENTION_ENABLED is set.
[functions."webmention"]
  node_bundler = "esbuild"

# Optional quote requests (ADR 0381). Off unless OPENBLOG_QUOTE_ENABLED is set.
[functions."quote"]
  node_bundler = "esbuild"

# The daily retention sweep of archived quote requests (ADR 0384); does nothing unless retention is set.
[functions."quote-retention"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/quote/*"
  to = "/.netlify/functions/quote/:splat"
  status = 200

# The delivery worker, called by pg_cron through pg_net with the worker key (ADR 0317).
[functions."social-worker"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/webmention"
  to = "/.netlify/functions/webmention"
  status = 200

[[redirects]]
  from = "/api/webmention/*"
  to = "/.netlify/functions/webmention/:splat"
  status = 200

[[redirects]]
  from = "/api/social-worker"
  to = "/.netlify/functions/social-worker"
  status = 200

[[redirects]]
  from = "/api/social/*"
  to = "/.netlify/functions/social/:splat"
  status = 200

# Keep authenticated Admin requests on Render, outside Netlify's proxy timeout.
[[redirects]]
  from = "/admin"
  to = "https://openblog-o0o5.onrender.com/admin/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://openblog-o0o5.onrender.com/admin/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/api/export"
  to = "/.netlify/functions/engagement/export"
  status = 200

[[redirects]]
  from = "/api/hit"
  to = "/.netlify/functions/engagement/hit"
  status = 200

[[redirects]]
  from = "/api/views"
  to = "/.netlify/functions/engagement/views"
  status = 200

[[redirects]]
  from = "/api/comments"
  to = "/.netlify/functions/engagement/comments"
  status = 200

[[redirects]]
  from = "/api/admin/comments"
  to = "/.netlify/functions/engagement/admin/comments"
  status = 200

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/engagement/feedback"
  status = 200

[[redirects]]
  from = "/api/admin/feedback"
  to = "/.netlify/functions/engagement/admin/feedback"
  status = 200

[[redirects]]
  from = "/api/admin/analytics"
  to = "/.netlify/functions/engagement/admin/analytics"
  status = 200

# The latest-posts JSON and the feeds may be read by scripts on other sites.
[[headers]]
  for = "/api/blog.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/api/views.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/feed.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Access-Control-Allow-Origin = "*"
