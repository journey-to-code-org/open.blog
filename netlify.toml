# Netlify settings for a blog that lives in a clone of the open.blog repository.
# Connect the repository in Netlify and it builds from this file: the engine is
# compiled, then `openblog build` writes dist/. Netlify installs the Rust
# toolchain named in rust-toolchain.toml.
#
# Scheduled posts publish on the first build after their date. Add a build hook
# in Netlify (Site configuration > Build & deploy > Build hooks) and put its URL
# in a repository secret named NETLIFY_BUILD_HOOK; the included GitHub workflow
# then triggers a rebuild once a day.
#
# Caching: Netlify's default (revalidate with an ETag) is kept on purpose.
# Pages reference stylesheets and scripts with a content-derived ?v= so they
# change URL when they change, but modules imported by other scripts are not
# versioned, so long path-based cache rules would serve stale code after a deploy.

[build]
  command = "cargo build --release -p openblog-cli --locked && ./target/release/openblog build"
  publish = "dist"

[build.environment]
  CARGO_TERM_COLOR = "always"

[functions]
  directory = "netlify/functions"

# Bundle the engagement function into one file, so it can import the shared
# feedback validator from web/components (ADR 0089). Other functions keep
# Netlify's default bundler.
[functions."engagement"]
  node_bundler = "esbuild"

# Keep authenticated Admin requests on Render, outside Netlify's proxy timeout.
[[redirects]]
  from = "/admin"
  to = "https://openblog-o0o5.onrender.com/admin/"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://openblog-o0o5.onrender.com/admin/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/api/hit"
  to = "/.netlify/functions/engagement/hit"
  status = 200

[[redirects]]
  from = "/api/views"
  to = "/.netlify/functions/engagement/views"
  status = 200

[[redirects]]
  from = "/api/comments"
  to = "/.netlify/functions/engagement/comments"
  status = 200

[[redirects]]
  from = "/api/admin/comments"
  to = "/.netlify/functions/engagement/admin/comments"
  status = 200

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/engagement/feedback"
  status = 200

[[redirects]]
  from = "/api/admin/feedback"
  to = "/.netlify/functions/engagement/admin/feedback"
  status = 200

[[redirects]]
  from = "/api/admin/analytics"
  to = "/.netlify/functions/engagement/admin/analytics"
  status = 200

# The latest-posts JSON and the feeds may be read by scripts on other sites.
[[headers]]
  for = "/api/blog.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/api/views.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/feed.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Access-Control-Allow-Origin = "*"
