name: Deploy Documentation to GitHub Pages

# The documentation site is an open.blog project (docs-site/) that publishes docs/ with the
# engine's own documentation section (ADR 0405), so it is rebuilt when the docs, the project,
# the engine or the shared themes and front end change.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "crates/**"
      - "themes/**"
      - "web/**"
      - "Cargo.lock"
      - "scripts/build-docs-site.mjs"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fill docs-site/content/docs from docs/
        run: node scripts/build-docs-site.mjs

      - name: Build the documentation site with open.blog
        run: cargo run --release -p openblog-cli -- build --root docs-site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
