name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test front-end components
        run: node --test tests/web/*.test.mjs tests/portability-contracts.test.mjs
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs
      - name: Build the starter site
        run: cargo run -p openblog-cli -- build
      - name: Build the portable publishing example
        run: cargo run -p openblog-cli -- build --root examples/portable-publishing
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Test browser publication and independent feed readers
        working-directory: tests/browser
        run: npm test
