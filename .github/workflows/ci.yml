name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # This workspace emits many integration-test binaries. Bound concurrent links and
        # omit test-only debug symbols so a hosted runner does not exhaust memory or disk.
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --workspace -j 2
      - name: Test front-end components
        run: |
          npm ci --prefix netlify --no-audit --no-fund
          node --test tests/web/*.test.mjs tests/portability-contracts.test.mjs
      - name: Test container startup
        run: sh tests/docker-entrypoint.sh
      - name: Check documentation links
        run: node scripts/check-doc-links.mjs
      - name: Build the documentation site
        # docs-site/ publishes docs/ with open.blog itself; a link between docs that does not
        # resolve fails the build here rather than on the deployed site.
        run: |
          set -o pipefail
          node scripts/build-docs-site.mjs
          cargo run -p openblog-cli -- build --root docs-site 2>&1 | tee "$RUNNER_TEMP/docs-site.log"
          if grep -q "does not match a page under docs/" "$RUNNER_TEMP/docs-site.log"; then
            echo "::error::a link in docs/ does not resolve on the documentation site"
            exit 1
          fi
      - name: Build the starter site
        run: cargo run -p openblog-cli -- build
      - name: Build the portable publishing example
        run: cargo run -p openblog-cli -- build --root examples/portable-publishing
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Install Chromium
        working-directory: tests/browser
        # The system packages come from Ubuntu's archive, which runners sometimes cannot reach, and apt
        # then waits out long timeouts. Give it five minutes, then install Chromium alone: the runner
        # image already has the libraries it needs, and only extra fonts come from the archive. If a
        # library were really missing, the browser tests below would fail on it.
        run: |
          if ! timeout 300 npx playwright install --with-deps chromium; then
            echo "::warning::Ubuntu's archive could not be reached in time; installing Chromium without system packages."
            npx playwright install chromium
          fi
      - name: Test browser publication and independent feed readers
        working-directory: tests/browser
        run: npm test

  diagram-wasm:
    # Admin's diagram preview runs the same core renderer compiled to WebAssembly (#580). Build it
    # from this commit, check it draws every fixture exactly as the native build does, and check
    # the module Admin serves is that build; the artifact is the module to commit when it is not.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the diagram module
        run: |
          cargo build -p openblog-wasm --lib --release --target wasm32-unknown-unknown --features diagram-rendering
          wasm-bindgen --target web --out-dir target/diagram-wasm-web target/wasm32-unknown-unknown/release/openblog_wasm.wasm
          wasm-bindgen --target nodejs --out-dir target/diagram-wasm-node target/wasm32-unknown-unknown/release/openblog_wasm.wasm
          cp web/admin/diagram-wasm/NOTICES.txt target/diagram-wasm-web/
      - name: Check the module draws what the build draws
        run: |
          cargo build -p openblog-wasm --example diagram-parity --features diagram-rendering
          node scripts/diagram-spike/core-parity.cjs target/diagram-wasm-node target/debug/examples/diagram-parity
      - name: Print the module for export
        run: |
          tar -C target/diagram-wasm-web -cJf /tmp/m.tar.xz openblog_wasm.js openblog_wasm_bg.wasm
          sha256sum target/diagram-wasm-web/openblog_wasm.js target/diagram-wasm-web/openblog_wasm_bg.wasm
          echo "BEGIN-WASM-EXPORT"; base64 -w 76 /tmp/m.tar.xz; echo "END-WASM-EXPORT"
      - uses: actions/upload-artifact@v4
        with:
          name: diagram-wasm
          path: |
            target/diagram-wasm-web/openblog_wasm.js
            target/diagram-wasm-web/openblog_wasm_bg.wasm
            target/diagram-wasm-web/NOTICES.txt
      - name: Check Admin serves this build
        run: |
          for file in openblog_wasm.js openblog_wasm_bg.wasm; do
            cmp "target/diagram-wasm-web/$file" "web/admin/diagram-wasm/$file" || {
              echo "::error::web/admin/diagram-wasm/$file is not this commit's build; replace it with the diagram-wasm artifact"
              exit 1
            }
          done

  social-queue-sql:
    # Runs the real plpgsql of the social delivery queue (claim, SKIP LOCKED, leases, settle and the
    # rollbacks), and of the Webmention request store, against a throwaway Postgres, so the SQL is
    # tested and not only matched by regexes.
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the social queue and Webmention SQL against Postgres
        env:
          OPENBLOG_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
        # One file at a time: each creates and removes the same tables in the one database.
        run: |
          npm ci --prefix netlify --no-audit --no-fund
          node --test --test-concurrency=1 tests/web/social-queue-sql.test.mjs tests/web/social-history-sql.test.mjs tests/web/social-ops-sql.test.mjs tests/web/social-release-gates.test.mjs tests/web/webmention-sql.test.mjs
