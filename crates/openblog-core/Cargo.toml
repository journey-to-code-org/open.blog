[package]
name = "openblog-core"
description = "Content model, Markdown rendering, feeds, and theme tokens for open.blog. Compiles natively and to WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
diagram-rendering = ["dep:merman", "dep:roxmltree"]
# PNG copies of diagrams for destinations that cannot show SVG, and for cards (native only).
diagram-png = ["diagram-rendering", "merman/png", "merman/native-fonts", "dep:merman-export"]

[dependencies]
http = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
blake2 = "0.10"
merman = { version = "=0.10.0", default-features = false, features = ["diagram-c4", "diagram-class", "diagram-er", "diagram-flowchart", "diagram-git-graph", "diagram-sequence", "diagram-state", "svg", "layout-cytoscape"], optional = true }
roxmltree = { version = "=0.20.0", optional = true }
merman-export = { version = "=0.10.0", default-features = false, features = ["png", "bundled-fonts"], optional = true }
