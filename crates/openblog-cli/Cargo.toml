[package]
name = "openblog-cli"
description = "The openblog command: build a static blog from Markdown, serve it locally, and import from Hashnode without a Pro plan."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openblog"
path = "src/main.rs"

[dependencies]
openblog-core = { path = "../openblog-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# Only the importer needs HTTP and HTML-to-Markdown conversion.
ureq = { version = "3", default-features = false, features = ["rustls"] }
htmd = "0.5"
# Admin login: a vetted password hash and OS randomness, never hand-rolled crypto.
argon2 = "0.5"
getrandom = "0.3"
